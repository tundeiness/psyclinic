name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (RSpec)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psyclinic_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job runs.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      CI: "true"
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      TEST_DATABASE_NAME: psyclinic_test
      DEVISE_JWT_SECRET_KEY: ci_only_jwt_secret_not_used_in_production_min_32_chars
      SECRET_KEY_BASE: ci_only_secret_key_base_not_used_in_production_environment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby 3.1.0
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.0"

      # bundler-cache requires a committed Gemfile.lock. We install
      # explicitly so CI works whether or not the lockfile is committed;
      # actions/cache still speeds up repeat runs when a lockfile exists.
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-ruby310-${{ hashFiles('**/Gemfile.lock', '**/Gemfile') }}
          restore-keys: |
            gems-${{ runner.os }}-ruby310-

      - name: Install gems
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Prepare test database
        run: bundle exec rails db:prepare

      - name: Run RSpec
        run: bundle exec rspec --format progress

  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby 3.1.0
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.0"

      - name: Install gems
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      # Fast guard: every Ruby file must parse before we trust the test run.
      - name: Ruby syntax check
        run: |
          find app config db lib spec -name "*.rb" -print0 \
            | xargs -0 -n1 -P4 ruby -c > /dev/null

  docker-build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    # CD only: never on PRs, only after tests pass on main.
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
