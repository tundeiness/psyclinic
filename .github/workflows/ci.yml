name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (RSpec)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psyclinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      TEST_DATABASE_NAME: psyclinic_test
      DEVISE_JWT_SECRET_KEY: ci_only_jwt_secret_key_minimum_thirty_two_chars_long
      SECRET_KEY_BASE: ci_only_secret_key_base_value_for_test_environment_only_xx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.0"
          # bundler-cache requires a committed Gemfile.lock. We don't
          # cache here so CI works before a lockfile is committed.
          # Once you commit Gemfile.lock, set this to: bundler-cache: true
          bundler-cache: false

      - name: Install gems
        run: |
          gem install bundler -v 2.5.6
          bundle install --jobs 4 --retry 3

      - name: Prepare database
        run: bundle exec rails db:prepare

      - name: Run RSpec
        run: bundle exec rspec

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: psyclinic-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
